<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>작심농장</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="zagsim_style.css" />
    <style>
      :root {
        --primary: #7c6dff; /* 시안의 메인 보라색 */
        --primary-soft: #f0eeff;
        --bg: #ffffff;
        --text: #1c1c1e;
        --gray: #8e8e93;
        --light-gray: #f2f2f7;
        --grass: #4cd964;
        --withered: #d2b48c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Pretendard", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 기기 프레임 (시안의 아이폰 폼팩터) */
      .iphone {
        width: 375px;
        height: 812px;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }
      .screen {
        display: none;
        width: 100%;
        height: 100%;
        padding: 60px 24px 100px;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--bg);
      }
      .screen.active {
        display: flex;
        z-index: 10;
      }

      /* 로고 스타일 (업로드하신 일러스트 로고 적용) */
      .logo-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
      }
      .main-logo {
        height: 38px;
        width: auto;
        object-fit: contain;
      }
      .logo-text {
        font-weight: 900;
        font-size: 20px;
        color: var(--text);
        letter-spacing: -0.5px;
      }

      /* 헤더 내비게이션 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        min-height: 40px;
      }
      .header-action {
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
      }
      .header-title {
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
      }

      /* 시안의 라운드 입력폼 */
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 10px;
        padding-left: 4px;
      }

        width: 100%;
        padding: 18px 24px;
        border-radius: 20px;

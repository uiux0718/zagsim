<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작심농장</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --primary: #7c6dff;
        --bg: #ffffff;
        --text: #1c1c1e;
        --gray: #8e8e93;
        --light-gray: #f2f2f7;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Pretendard", sans-serif;
      }

      body {
        background: #eef2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* 아이폰 폼팩터 프레임 */
      .app-container {
        width: 100%;
        max-width: 375px;
        height: 812px;
        background: var(--bg);
        border-radius: 44px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      .screen {
        display: none;
        width: 100%;
        height: 100%;
        padding: 60px 24px;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--bg);
      }
      .screen.active {
        display: flex;
        z-index: 10;
      }

      /* 로고 및 텍스트 스타일 */
      .logo-area {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
      }
      .logo-img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .logo-text {
        font-weight: 900;
        font-size: 18px;
        color: var(--text);
      }

      /* 입력 폼 스타일 */
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }
      .input-group input {
        width: 100%;
        padding: 18px;
        border-radius: 20px;
        border: 1.5px solid var(--light-gray);
        background: var(--light-gray);
        outline: none;
        font-size: 15px;
      }

      /* 버튼 스타일 */
      .btn-primary {
        width: 100%;
        padding: 20px;
        border-radius: 20px;
        border: none;
        background: var(--primary);
        color: white;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <section id="s-login" class="screen active">
        <div class="logo-area">
          <img src="logo.png" alt="로고" class="logo-img" />
          <span class="logo-text">작심농장</span>
        </div>
        <h1 style="margin-bottom: 10px; font-size: 28px">환영합니다</h1>
        <p style="color: var(--gray); margin-bottom: 40px">
          오늘의 수확을 위해 로그인해주세요.
        </p>

        <div class="input-group">
          <label>이메일</label>
          <input type="email" placeholder="이메일 주소를 입력하세요" />
        </div>
        <div class="input-group">
          <label>비밀번호</label>
          <input type="password" placeholder="비밀번호를 입력하세요" />
        </div>

        <button class="btn-primary" onclick="go('s-home')">
          수확 시작하기
        </button>
        <button
          style="
            background: none;
            border: none;
            margin-top: 20px;
            color: var(--gray);
            cursor: pointer;
            width: 100%;
            font-size: 14px;
          "
          onclick="go('s-join')"
        >
          계정이 없으신가요? 회원가입
        </button>
      </section>

      <section id="s-join" class="screen">
        <div
          style="
            margin-bottom: 30px;
            cursor: pointer;
            color: var(--primary);
            font-size: 14px;
          "
          onclick="go('s-login')"
        >
          이전으로
        </div>
        <h1 style="font-size: 28px">농장주 등록</h1>
        <p style="color: var(--gray); margin-top: 10px; margin-bottom: 40px">
          당신만의 특별한 농장을 만들어보세요.
        </p>

        <div class="input-group">
          <label>이름</label><input type="text" placeholder="이름 입력" />
        </div>
        <div class="input-group">
          <label>이메일</label><input type="email" placeholder="이메일 입력" />
        </div>
        <div class="input-group">
          <label>비밀번호</label
          ><input type="password" placeholder="8자 이상 입력" />
        </div>
        <button class="btn-primary" onclick="go('s-login')">등록 완료</button>
      </section>

      <section id="s-home" class="screen">
        <h2>메인 대시보드</h2>
      </section>
    </div>

    <script>
      // 화면 전환 함수
      function go(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }
    </script>
  </body>
</html>

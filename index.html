<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>작심농장</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="zagsim_style.css" />
    <style>
      :root {
        --primary: #7c6dff; /* 시안의 메인 보라색 */
        --primary-soft: #f0eeff;
        --bg: #ffffff;
        --text: #1c1c1e;
        --gray: #8e8e93;
        --light-gray: #f2f2f7;
        --grass: #4cd964;
        --withered: #d2b48c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Pretendard", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 기기 프레임 (시안의 아이폰 폼팩터) */
      .iphone {
        width: 375px;
        height: 812px;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }
      .screen {
        display: none;
        width: 100%;
        height: 100%;
        padding: 60px 24px 100px;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--bg);
      }
      .screen.active {
        display: flex;
        z-index: 10;
      }

      /* 로고 스타일 (업로드하신 일러스트 로고 적용) */
      .logo-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
      }
      .main-logo {
        height: 38px;
        width: auto;
        object-fit: contain;
      }
      .logo-text {
        font-weight: 900;
        font-size: 20px;
        color: var(--text);
        letter-spacing: -0.5px;
      }

      /* 헤더 내비게이션 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        min-height: 40px;
      }
      .header-action {
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
      }
      .header-title {
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
      }

      /* 시안의 라운드 입력폼 */
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 10px;
        padding-left: 4px;
      }
      .input-group input {
        width: 100%;
        padding: 18px 24px;
        border-radius: 20px;
        border: 1.5px solid var(--light-gray);
        background: var(--light-gray);
        outline: none;
        font-size: 16px;
        transition: 0.2s;
      }
      .input-group input:focus {
        border-color: var(--primary);
        background: #fff;
      }

      /* 메인 대시보드 카드 */
      .dashboard-card {
        background: var(--primary-soft);
        padding: 32px;
        border-radius: 32px;
        text-align: center;
        margin-bottom: 28px;
      }
      .status-badge {
        display: inline-block;
        padding: 6px 14px;
        background: #fff;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 16px;
      }

      /* 시안의 습관 리스트 카드 UI */
      .habit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .habit-card {
        background: var(--light-gray);
        padding: 35px 20px;
        border-radius: 28px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
        border: 2px solid transparent;
      }
      .habit-card:active {
        transform: scale(0.96);
        background: var(--primary-soft);
        border-color: var(--primary);
      }
      .habit-icon-box {
        width: 44px;
        height: 44px;
        background: #fff;
        border-radius: 14px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .habit-dot {
        width: 10px;
        height: 10px;
        background: var(--primary);
        border-radius: 50%;
      }
      .habit-name {
        font-weight: 800;
        font-size: 15px;
        color: var(--text);
      }

      /* 버튼 시스템 */
      .btn-primary {
        width: 100%;
        padding: 22px;
        border-radius: 22px;
        border: none;
        background: var(--primary);
        color: white;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-primary:active {
        opacity: 0.8;
        transform: scale(0.98);
      }
      .btn-text {
        background: none;
        border: none;
        color: var(--gray);
        padding: 16px;
        cursor: pointer;
        font-size: 14px;
        width: 100%;
        font-weight: 600;
      }

      /* 하단 내비게이션 바 (시안 참조) */
      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 92px;
        border-top: 1.5px solid var(--light-gray);
        display: none;
        justify-content: space-around;
        padding-top: 14px;
        background: white;
        z-index: 100;
      }
      .nav-item {
        text-align: center;
        color: var(--gray);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        flex: 1;
      }
      .nav-item.active {
        color: var(--primary);
      }
      .nav-dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
        margin: 0 auto 6px;
      }

      /* 팝업 모달 */
      .overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }
      .modal {
        background: white;
        padding: 36px 24px;
        border-radius: 32px;
        width: 100%;
        text-align: center;
        animation: slideUp 0.3s ease-out;
      }

      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      #toast {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 16px 28px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        display: none;
        z-index: 2000;
      }
    </style>
  </head>
  <body>
    <div class="iphone">
      <section id="s-login" class="screen active">
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
          "
        >
          <div class="logo-container">
            <img src="logo.png" alt="작심농장" class="main-logo" />
            <span class="logo-text">작심농장</span>
          </div>
          <h1
            style="
              font-size: 30px;
              font-weight: 900;
              margin-bottom: 12px;
              letter-spacing: -1px;
            "
          >
            환영합니다
          </h1>
          <p style="color: var(--gray); margin-bottom: 40px; font-weight: 500">
            오늘의 수확을 위해 로그인해주세요.
          </p>

          <div class="input-group">
            <label>이메일</label>
            <input type="email" placeholder="이메일 주소를 입력하세요" />
          </div>
          <div class="input-group">
            <label>비밀번호</label>
            <input type="password" placeholder="비밀번호를 입력하세요" />
          </div>

          <button class="btn-primary" onclick="go('s-home')">
            수확 시작하기
          </button>
          <button class="btn-text" onclick="go('s-join')">
            계정이 없으신가요? 회원가입
          </button>
        </div>
      </section>

      <section id="s-join" class="screen">
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
          "
        >
          <div class="header" style="margin-bottom: 40px">
            <span class="header-action" onclick="go('s-login')">이전으로</span>
          </div>
          <h1 style="font-size: 30px; font-weight: 900; margin-bottom: 12px">
            농장주 등록
          </h1>
          <p style="color: var(--gray); margin-bottom: 40px">
            당신만의 특별한 농장을 만들어보세요.
          </p>
          <div class="input-group">
            <label>이름</label><input type="text" placeholder="이름 입력" />
          </div>
          <div class="input-group">
            <label>이메일</label
            ><input type="email" placeholder="이메일 입력" />
          </div>
          <div class="input-group">
            <label>비밀번호</label
            ><input type="password" placeholder="8자 이상 입력" />
          </div>
          <button class="btn-primary" onclick="go('s-login')">등록 완료</button>
        </div>
      </section>

      <section id="s-home" class="screen">
        <header class="header">
          <div
            class="logo-area"
            onclick="openRules()"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              cursor: pointer;
            "
          >
            <img src="logo.png" alt="logo" style="height: 28px" />
            <span style="font-weight: 900; font-size: 16px">작심농장</span>
          </div>
          <span class="header-action" onclick="go('s-noti')">알림설정</span>
        </header>

        <div class="dashboard-card">
          <span class="status-badge">관리 중인 토지 1</span>
          <h2
            id="streak-txt"
            style="font-size: 22px; font-weight: 900; margin-bottom: 20px"
          >
            연속 수확 0회차
          </h2>
          <div
            id="grid"
            style="
              display: grid;
              grid-template-columns: repeat(7, 1fr);
              gap: 8px;
            "
          ></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
          "
        >
          <h3 style="font-size: 17px; font-weight: 800">나의 기록 카드</h3>
          <span class="header-action" onclick="openAddModal()">카드 추가</span>
        </div>

        <div class="habit-grid" id="habit-container">
          <div class="habit-card" onclick="harvest('물 마시기')">
            <div class="habit-icon-box"><div class="habit-dot"></div></div>
            <p class="habit-name">물 마시기</p>
          </div>
          <div class="habit-card" onclick="harvest('영양제')">
            <div class="habit-icon-box"><div class="habit-dot"></div></div>
            <p class="habit-name">영양제</p>
          </div>
        </div>
      </section>

      <section id="s-noti" class="screen">
        <header class="header">
          <span class="header-action" onclick="go('s-home')">홈으로</span>
          <span class="header-title">알림 설정</span>
          <div style="width: 40px"></div>
        </header>
        <div style="margin-top: 10px">
          <div class="noti-card">
            <div>
              <h4>수확 리마인더</h4>
              <p>매일 잊지 않도록 푸시를 보냅니다</p>
            </div>
            <div class="toggle on" id="t-remind" onclick="toggleNoti('remind')">
              <div class="toggle-handle"></div>
            </div>
          </div>
          <div class="noti-card">
            <div>
              <h4>패널티 경고</h4>
              <p>3일간 미수확 시 경고 알림을 보냅니다</p>
            </div>
            <div class="toggle on" id="t-penalty" onclick="toggleNoti('penalty')">
              <div class="toggle-handle"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="s-mypage" class="screen">
        <header class="header">
          <span class="header-title" style="font-size: 22px; font-weight: 900"
            >내 정보</span
          >
        </header>
        <div style="display: flex; gap: 12px; margin-bottom: 30px">
          <div
            style="
              flex: 1;
              background: var(--primary-soft);
              padding: 24px;
              border-radius: 28px;
              text-align: center;
            "
          >
            <span
              style="font-size: 28px; font-weight: 900; color: var(--primary)"
              id="val-total"
              >0</span
            >
            <p
              style="
                font-size: 12px;
                color: var(--gray);
                margin-top:

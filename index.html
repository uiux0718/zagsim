<!doctype html>

<html lang="ko">

  <head>

    <meta charset="UTF-8" />

    <meta

      name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    />

    <title>작심삼일 감지기</title>

    <link rel="stylesheet" href="style.css" />

  </head>

  <body>

    <div class="iphone-frame">

      <section id="v-onboarding" class="view active">

        <div class="inner flex-center">

          <div class="main-logo">🔥</div>

          <h1 class="logo-title">

            작심삼일 <span class="purple">감지기</span>

          </h1>

          <p class="logo-sub">당신의 이탈 징후를 <br />똑똑하게 감지합니다.</p>

          <button class="btn-full" onclick="go('v-goal')">지금 시작하기</button>

        </div>

      </section>

​

      <section id="v-goal" class="view">

        <header class="sub-header">

          <button class="back-btn" onclick="go('v-onboarding')">←</button>

          <h2>목표 설정</h2>

        </header>

        <div class="inner">

          <div class="form-group">

            <label>달성하고 싶은 목표</label>

            <input

              type="text"

              placeholder="예: 매일 운동하기"

              class="input-base"

            />

          </div>

          <div class="form-group">

            <label>실천 빈도</label>

            <div class="chip-row">

              <button class="chip active">매일</button>

              <button class="chip">주 3회</button>

              <button class="chip">주 5회</button>

            </div>

          </div>

          <button class="btn-full fixed-bottom" onclick="go('v-home')">

            설정 완료

          </button>

        </div>

      </section>

​

      <section id="v-home" class="view">

        <header class="app-header">

          <span class="date">2026.04.23</span>

          <div class="user-icon" onclick="go('v-settings')">👤</div>

        </header>

        <div class="inner">

          <div

            id="status-card"

            class="card-status normal"

            onclick="simulateDanger()"

          >

            <p>현재 감지 상태</p>

            <h2 id="status-text">안전 유지 중 ✅</h2>

            <div class="progress">

              <div class="bar" style="width: 100%"></div>

            </div>

          </div>

​

          <div class="section-title">오늘의 기록</div>

          <div class="habit-list">

            <div class="habit-card" onclick="this.classList.toggle('done')">

              <span>🧘 아침 스트레칭</span>

              <div class="check"></div>

            </div>

            <div class="habit-card" onclick="this.classList.toggle('done')">

              <span>📖 독서 30분</span>

              <div class="check"></div>

            </div>

          </div>

​

          <div id="alert-box" class="intervention-alert hide">

            <p>🚨 <strong>위험!</strong> 2일째 미기록 중</p>

            <small>“지금 포기 중입니다.” 리커버리 할까요?</small>

            <button onclick="go('v-report')">내 패턴 분석 보기</button>

          </div>

        </div>

      </section>

​

      <section id="v-settings" class="view">

        <header class="sub-header">

          <button class="back-btn" onclick="go('v-home')">←</button>

          <h2>내 정보 수정</h2>

        </header>

        <div class="inner">

          <div class="profile-edit">

            <div class="avatar">👤</div>

            <button class="txt-link">사진 변경</button>

          </div>

          <div class="form-group">

            <label>닉네임</label>

            <input type="text" value="예지 (YEDI)" class="input-base" />

          </div>

          <div class="form-group">

            <label>이메일</label>

            <input

              type="text"

              value="yedi@naver.com"

              class="input-base"

              disabled

            />

          </div>

          <button class="btn-full fixed-bottom" onclick="go('v-home')">

            저장하기

          </button>

        </div>

      </section>

​

      <section id="v-report" class="view">

        <header class="sub-header">

          <button class="back-btn" onclick="go('v-home')">←</button>

          <h2>패턴 분석</h2>

        </header>

        <div class="inner">

          <div class="report-box">

            <h4>가장 취약한 시점</h4>

            <p class="purple">목요일 오후 8시</p>

          </div>

          <div class="graph-area">

            <div class="bar-chart">

              <div class="b-item" style="height: 90%"></div>

              <div class="b-item" style="height: 60%"></div>

              <div class="b-item danger" style="height: 20%"></div>

            </div>

          </div>

          <button

            class="btn-full fixed-bottom"

            style="background: #333"

            onclick="go('v-home')"

          >

            다시 도전하기

          </button>

        </div>

      </section>

    </div>

​

    <script>

      function go(id) {

        document

          .querySelectorAll(".view")

          .forEach((v) => v.classList.remove("active"));

        document.getElementById(id).classList.add("active");

      }

      function simulateDanger() {

        const card = document.getElementById("status-card");

        const text = document.getElementById("status-text");

        const alertBox = document.getElementById("alert-box");

        card.classList.replace("normal", "danger");

        text.innerText = "작심삼일 위기! ⚠️";

        alertBox.classList.remove("hide");

      }

    </script>

  </body>

</html>

​

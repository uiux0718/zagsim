<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>작심농장 - 전체 반응형 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      :root {
        --primary: #7c6dff;
        --primary-soft: #f0eeff;
        --bg: #ffffff;
        --text: #1c1c1e;
        --gray: #8e8e93;
        --light-gray: #f2f2f7;
        --border: #e5e5ea;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Pretendard", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* ==========================================
         [반응형 레이아웃] PC / 태블릿 / 모바일 핵심 설정
         ========================================== */
      body, html {
        width: 100%;
        height: 100%;
        background-color: #111; /* 데스크탑/태블릿용 어두운 외부 배경 */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 기본값: 데스크탑 & 태블릿 (화면 중앙에 아이폰 프레임 배치) */
      .iphone {
        width: 375px;
        height: 812px;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
      }

      /* 모바일 브레이크포인트 (화면 폭이 480px 이하일 때 화면 꽉 차게 변경) */
      @media (max-width: 480px) {
        body, html {
          background-color: var(--bg);
        }
        .iphone {
          width: 100% !important;
          height: 100% !important;
          border-radius: 0px !important;
          box-shadow: none !important;
        }
        .screen {
          padding: 44px 20px 100px !important;
        }
      }

      /* ==========================================
         컴포넌트 세부 스타일
         ========================================== */
      
      .screen {
        display: none; 
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 60px 24px 100px;
        background: var(--bg);
        overflow-y: auto;
      }

      .screen.active {
        display: flex;
      }

      /* 상단 내비게이션 헤더 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        min-height: 44px;
        width: 100%;
      }

      .header-action {
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
        width: 60px;
        border: none;
        background: none;
        text-align: left;
      }

      /* 로고 정렬을 위한 타이틀 공간 박스 */
      .header-title {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        height: 100%;
      }

      /* 엑박 방지 및 중앙 정렬 처리된 로고 스타일 */
      .logo-img {
        height: 32px;         /* 피그마 레이아웃에 맞춘 적정 높이 */
        width: auto;
        object-fit: contain;
        display: block;
      }

      /* 타이틀 및 캡션 */
      .title-section {
        margin-bottom: 32px;
      }

      .title-section h1 {
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
        line-height: 1.3;
        margin-bottom: 8px;
      }

      .title-section p {
        font-size: 14px;
        color: var(--gray);
        font-weight: 500;
      }

      /* 폼 입력 필드 */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        margin-bottom: 24px;
      }

      .input-wrapper {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        padding-left: 4px;
      }

      .input-field {
        width: 100%;
        height: 52px;
        background-color: var(--light-gray);
        border: 1.5px solid transparent;
        border-radius: 16px;
        padding: 0 16px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        outline: none;
        transition: all 0.2s;
      }

      .input-field::placeholder {
        color: var(--gray);
        font-weight: 500;
      }

      .input-field:focus {
        border-color: var(--primary);
        background-color: var(--bg);
      }

      /* 알림 설정 카드 */
      .noti-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .noti-card {
        background-color: var(--light-gray);
        border-radius: 24px;
        padding: 24px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .noti-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        padding-right: 12px;
      }

      .noti-title {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .noti-desc {
        font-size: 12px;
        color: var(--gray);
        font-weight: 500;
        line-height: 1.4;
      }

      /* 토글 스위치 */
      .toggle {
        width: 51px;
        height: 31px;
        background: #e5e5ea;
        border-radius: 16px;
        position: relative;
        cursor: pointer;
        transition: background-color 0.2s;
        flex-shrink: 0;
      }

      .toggle.on {
        background: var(--primary);
      }

      .toggle-handle {
        width: 27px;
        height: 27px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        left: 2px;
        transition: left 0.2s;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }

      .toggle.on .toggle-handle {
        left: 22px;
      }

      /* 액션 버튼 */
      .btn-container {
        margin-top: auto; 
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }

      .btn-primary {
        width: 100%;
        height: 56px;
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-sub {
        font-size: 14px;
        color: var(--gray);
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        background: none;
        border: none;
      }

      /* 기록 카드 카테고리 태그 */
      .tag-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 8px;
      }

      .tag-btn {
        padding: 10px 16px;
        background-color: var(--light-gray);
        color: var(--text);
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .tag-btn.active {
        background-color: var(--primary-soft);
        color: var(--primary);
      }

      /* 하단 탭 내비게이션 바 */
      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 92px;
        border-top: 1.5px solid var(--light-gray);
        display: flex;
        justify-content: space-around;
        padding-top: 14px;
        background: white;
        z-index: 100;
      }

      .nav-item {
        text-align: center;
        color: var(--gray);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        flex: 1;
      }

      .nav-item.active {
        color: var(--primary);
      }

      .nav-dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
        margin: 0 auto 6px;
      }
    </style>
  </head>
  <body>

    <div class="iphone">
      
      <section id="s-login" class="screen active">
        <header class="header">
          <button class="header-action"></button>
          <div class="header-title">
            <img src="./logo.png" alt="작심농장 로고" class="logo-img">
          </div>
          <div style="width: 60px;"></div>
        </header>

        <div class="title-section">
          <h1>작심삼일 탈출,<br>작심농장에서 시작해요</h1>
          <p>내 이탈 징후를 똑똑하게 감지하는 시스템</p>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input type="email" class="input-field" placeholder="이메일 주소 입력" required>
          </div>
          <div class="input-wrapper">
            <input type="password" class="input-field" placeholder="비밀번호 입력" required>
          </div>
        </div>

        <div class="btn-container">
          <button class="btn-primary" onclick="navigateTo('s-noti')">로그인</button>
          <button class="btn-sub" onclick="navigateTo('s-signup')">아직 계정이 없으신가요? 회원가입</button>
        </div>
      </section>

      <section id="s-signup" class="screen">
        <header class="header">
          <button class="header-action" onclick="navigateTo('s-login')">이전</button>
          <div class="header-title">
            <img src="./logo.png" alt="작심농장 로고" class="logo-img">
          </div>
          <div style="width: 60px;"></div>
        </header>

        <div class="title-section">
          <h1>반갑습니다!<br>정보를 입력해주세요</h1>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-label">닉네임</span>
            <input type="text" class="input-field" placeholder="농부 이름을 정해주세요">
          </div>
          <div class="input-wrapper">
            <span class="input-label">이메일</span>
            <input type="email" class="input-field" placeholder="example@email.com">
          </div>
          <div class="input-wrapper">
            <span class="input-label">비밀번호</span>
            <input type="password" class="input-field" placeholder="영문, 숫자 포함 8자 이상">
          </div>
        </div>

        <div class="btn-container">
          <button class="btn-primary" onclick="alert('가입 완료! 로그인 화면으로 이동합니다.'); navigateTo('s-login')">가입하기</button>
        </div>
      </section>

      <section id="s-noti" class="screen">
        <header class="header">
          <button class="header-action" onclick="navigateTo('s-login')">홈으로</button>
          <div class="header-title">
            <img src="./logo.png" alt="작심농장 로고" class="logo-img">
          </div>
          <div style="width: 60px;"></div>
        </header>

        <div class="noti-container">
          <div class="noti-card">
            <div class="noti-info">
              <h4 class="noti-title">수확 리마인더</h4>
              <p class="noti-desc">매일 잊지 않도록 푸시를 보냅니다</p>
            </div>
            <div class="toggle on" id="t-remind" onclick="toggleNoti('t-remind')">
              <div class="toggle-handle"></div>
            </div>
          </div>

          <div class="noti-card">
            <div class="noti-info">
              <h4 class="noti-title">패널티 경고</h4>
              <p class="noti-desc">3일간 미수확 시 경고 알림을 보냅니다</p>
            </div>
            <div class="toggle on" id="t-penalty" onclick="toggleNoti('t-penalty')">
              <div class="toggle-handle"></div>
            </div>
          </div>
        </div>

        <div class="btn-container">
          <button class="btn-primary" style="background-color: #3a3a3c;" onclick="navigateTo('s-record')">기록카드 작성하러 가기</button>
        </div>

        <nav class="bottom-nav">
          <div class="nav-item" onclick="alert('홈 스크린 미구현')">
            <div class="nav-dot"></div>홈
          </div>
          <div class="nav-item active">
            <div class="nav-dot" style="opacity: 0;"></div>내 정보
          </div>
        </nav>
      </section>

      <section id="s-record" class="screen">
        <header class="header">
          <button class="header-action" onclick="navigateTo('s-noti')">이전</button>
          <div class="header-title">
            <img src="./logo.png" alt="작심농장 로고" class="logo-img">
          </div>
          <div style="width: 60px;"></div>
        </header>

        <div class="title-section">
          <h1>오늘 실천한 루틴을<br>농장에 기록할까요?</h1>
          <p>작은 기록이 모여 작물을 성장시킵니다</p>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-label">루틴 카테고리</span>
            <div class="tag-container">
              <button class="tag-btn active" onclick="selectTag(this)">🏃‍♂️ 운동</button>
              <button class="tag-btn" onclick="selectTag(this)">📚 독서</button>
              <button class="tag-btn" onclick="selectTag(this)">🧘‍♂️ 스트레칭</button>
              <button class="tag-btn" onclick="selectTag(this)">💧 수분섭취</button>
            </div>
          </div>

          <div class="input-wrapper">
            <span class="input-label">수행 내용</span>
            <input type="text" class="input-field" placeholder="예: 헬스장 30분 오운완!">
          </div>

          <div class="input-wrapper">
            <span class="input-label">수행 시간 (분 단위)</span>
            <input type="number" class="input-field" placeholder="예: 30">
          </div>
        </div>

        <div class="btn-container">
          <button class="btn-primary" onclick="alert('기록이 등록되었습니다!'); navigateTo('s-noti');">작성 완료</button>
        </div>
      </section>

    </div>

    <script>
      function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
          screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
      }

      function toggleNoti(id) {
        const toggleBtn = document.getElementById(id);
        toggleBtn.classList.toggle('on');
      }

      function selectTag(element) {
        const siblings = element.parentNode.querySelectorAll('.tag-btn');
        siblings.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
      }
    </script>
  </body>
</html>
